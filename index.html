      if(e.key==='F12'||(e.ctrlKey&&(e.key==='u'||e.key==='U'||e.key==='s'||e.key==='S'||e.key==='p'||e.key==='P'))||(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='i'||e.key==='J'||e.key==='j'||e.key==='C'||e.key==='c'||e.key==='K'||e.key==='k'))){
        e.preventDefault();e.stopPropagation();return false;
      }
    },true);

    // Supressão de mensagens na consola
    try{
      ['log','info','warn','error','dir','table','trace','debug'].forEach(function(m){console[m]=function(){};});
    }catch(e){}

    // Detetor de DevTools e depuração não autorizada
    setInterval(function(){
      var t=performance.now();
      (function(){}).constructor('debugger')();
      if(performance.now()-t>100){
        document.body.innerHTML='<div style="background:#060b3a;color:#ff9f9f;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:18px;font-weight:700;">Acesso ao código-fonte protegido.</div>';
      }
    },1500);

    async function _0xsha256(s){
      var b=new TextEncoder().encode(s);
      var h=await crypto.subtle.digest('SHA-256',b);
      var a=Array.from(new Uint8Array(h));
      return a.map(function(x){return x.toString(16).padStart(2,'0');}).join('');
    }

    function _0xfail(msg){
      var el=document.getElementById('_0x_shield');
      if(el){
        el.innerHTML='<div class="_0x_err"><h2>⚠️ Proteção Contra Alteração Ativada</h2><p>'+msg+'</p></div>';
      }
    }

    async function _0xrun(){
      try{
        var h=await _0xsha256(_0xd);
        if(h!==_0xh){
          _0xfail('Este ficheiro foi alterado ou corrompido. O código está protegido contra modificações e a sua execução foi bloqueada.');
          return;
        }
        var bin=atob(_0xd);
        var bytes=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++){
          var k=_0xk[i%_0xk.length];
          var rot=((i*7)+13)%256;
          bytes[i]=bin.charCodeAt(i)^k^rot;
        }
        var dec=new TextDecoder('utf-8').decode(bytes);
        _0xd=null;_0xk=null;_0xh=null;

        var parser=new DOMParser();
        var doc=parser.parseFromString(dec,'text/html');

        if(doc.title) document.title=doc.title;

        // 1. Copiar atributos do <html> (estilos, variáveis CSS, etc.)
        for(var i=0;i<doc.documentElement.attributes.length;i++){
          var attr=doc.documentElement.attributes[i];
          document.documentElement.setAttribute(attr.name,attr.value);
        }

        // 2. Limpar e preencher <head> (meta, fontes, links, estilos)
        var headNodes=[];
        for(var i=0;i<doc.head.childNodes.length;i++){
          var node=doc.head.childNodes[i];
          if(node.nodeName!=='SCRIPT'){
            headNodes.push(node.cloneNode(true));
          }
        }
        document.head.innerHTML='';
        headNodes.forEach(function(el){ document.head.appendChild(el); });

        // Adicionar proteção de seleção ao <head>
        var antiSelectStyle=document.createElement('style');
        antiSelectStyle.textContent='*:not(input):not(textarea):not(select){-webkit-user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;user-select:none!important;}';
        document.head.appendChild(antiSelectStyle);

        // 3. Copiar atributos do <body> (classes, atributos)
        document.body.className=doc.body.className;
        for(var i=0;i<doc.body.attributes.length;i++){
          var attr=doc.body.attributes[i];
          document.body.setAttribute(attr.name,attr.value);
        }

        // 4. Extrair todos os scripts antes de renderizar o corpo
        var scripts=Array.from(doc.querySelectorAll('script'));
        doc.querySelectorAll('script').forEach(function(s){ s.remove(); });
        document.body.innerHTML=doc.body.innerHTML;

        // 5. Executar scripts sequencialmente garantindo que o Firebase carrega primeiro
        for(var sIdx=0;sIdx<scripts.length;sIdx++){
          var origScript=scripts[sIdx];
          await new Promise(function(resolve){
            var s=document.createElement('script');
            for(var a=0;a<origScript.attributes.length;a++){
              s.setAttribute(origScript.attributes[a].name,origScript.attributes[a].value);
            }
            if(s.src){
              s.onload=function(){ resolve(); };
              s.onerror=function(){
                console.warn('Erro ao carregar script externo:', s.src);
                resolve();
              };
              document.head.appendChild(s);
            }else{
              s.text=origScript.textContent;
              document.body.appendChild(s);
              resolve();
            }
          });
        }
      }catch(err){
        _0xfail('Erro ao verificar integridade: '+err.message);
      }
    }

    if(window.crypto&&window.crypto.subtle){
      _0xrun();
    }else{
      _0xfail('O ambiente de execução não suporta a API de segurança necessária.');
    }
  })();
  </script>
