      return a.map(function(x){return x.toString(16).padStart(2,'0');}).join('');
    }

    function _0xfail(msg){
      var el=document.getElementById('_0x_shield');
      if(el){
        el.innerHTML='<div class="_0x_err"><h2>⚠️ Proteção Contra Alteração Ativada</h2><p>'+msg+'</p></div>';
      }
    }

    async function _0xrun(){

        for(var i=0;i<doc.documentElement.attributes.length;i++){
          var attr=doc.documentElement.attributes[i];
          document.documentElement.setAttribute(attr.name,attr.value);
        }

        // 2. Limpar e preencher <head> (meta, fontes, links, estilos)
        var headNodes=[];
        for(var i=0;i<doc.head.childNodes.length;i++){
          var node=doc.head.childNodes[i];
          if(node.nodeName!=='SCRIPT'){
            headNodes.push(node.cloneNode(true));

        }
        document.head.innerHTML='';
        headNodes.forEach(function(el){ document.head.appendChild(el); });

        // Adicionar proteção de seleção ao <head>

        var scripts=Array.from(doc.querySelectorAll('script'));
        doc.querySelectorAll('script').forEach(function(s){ s.remove(); });
